<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconicGames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:#000;color:#fff;font:16px/1.65 "Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;cursor:pointer}
.d{font-family:Oswald,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;font-weight:700;letter-spacing:.01em;line-height:1}
.mut{color:#9a9a9a}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
/* header */
header{position:sticky;top:0;z-index:20;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:rgba(0,0,0,.94);border-bottom:1px solid #222;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:34px;height:34px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font:700 15px Oswald,Impact,sans-serif;letter-spacing:.04em}
.brand span{font:700 20px Oswald,Impact,sans-serif;letter-spacing:.18em;text-transform:uppercase}
nav{display:flex;gap:36px}
nav a{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:6px 0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{border-color:#fff}
.btn{display:inline-block;border:1px solid #fff;padding:15px 34px;font:700 16px Oswald,Impact,sans-serif;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:#fff;cursor:pointer;transition:.15s}
.btn:hover{background:#fff;color:#000}
.btn.s{background:#fff;color:#000}.btn.s:hover{background:#d8d8d8;border-color:#d8d8d8}
.btn.sm{padding:9px 22px;font-size:14px}
/* hero */
.hero{position:relative;min-height:calc(100vh - 72px);display:flex;align-items:flex-end;background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),#000 96%),linear-gradient(90deg,rgba(0,0,0,.75),transparent 60%)}
.hero .in{position:relative;z-index:1;padding:0 40px 90px;max-width:900px}
.hero small,.k{font:500 14px Oswald,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#bbb}
.hero h1{font-size:clamp(56px,10vw,150px);margin:14px 0 20px}
.hero p{font-size:19px;max-width:520px;color:#ddd;margin-bottom:32px}
.hero .row{display:flex;gap:14px;flex-wrap:wrap}
/* sections */
section{padding:84px 0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:34px;border-bottom:1px solid #222;padding-bottom:16px}
.sh h2{font-size:clamp(30px,4vw,48px)}
.sh a{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#bbb}.sh a:hover{color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.gc{display:block}
.gc .pic{aspect-ratio:4/5;position:relative;overflow:hidden;border:1px solid #222}
.gc .pic .ph,.gc .pic img{width:100%;height:100%;object-fit:cover;transition:transform .5s;filter:grayscale(1)}
.gc:hover .pic .ph,.gc:hover .pic img{transform:scale(1.05)}
.gc .tt{position:absolute;left:0;right:0;bottom:0;padding:60px 22px 22px;background:linear-gradient(transparent,#000);font-size:34px}
.gc .lb{margin-top:14px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#bbb}
.gc p{color:#9a9a9a;font-size:15px;margin-top:4px}
.nc{display:block;border:1px solid #222;background:#0a0a0a;transition:.2s}.nc:hover{border-color:#fff}
.nc .ph{aspect-ratio:16/9}
.nc .tx{padding:22px}.nc h3{font:700 22px Oswald,sans-serif;text-transform:uppercase;line-height:1.2;margin:8px 0}
.nc p{color:#9a9a9a;font-size:14px}
.ph{background:repeating-linear-gradient(135deg,var(--a,#1c1c1c) 0 14px,var(--b,#141414) 14px 28px)}
.band{background:#fff;color:#000;padding:56px 0}
.band .wrap{display:flex;gap:30px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.band h2{font-size:36px}.band p{color:#444;max-width:460px}
.band form{display:flex;gap:0;flex:1;min-width:280px;max-width:520px}
.band input{flex:1;border:1px solid #000;border-right:0;padding:14px 18px;font-size:16px;background:#fff;color:#000;min-width:0}
.band .btn{border-color:#000;color:#fff;background:#000}.band .btn:hover{background:#333}
.about p{max-width:720px;font-size:20px;color:#ccc;margin-bottom:20px}
footer{border-top:1px solid #222;padding:56px 0 40px;color:#9a9a9a;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between}
footer h4{font:700 14px Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#fff;margin-bottom:14px}
footer a{display:block;margin-bottom:8px}footer a:hover{color:#fff}
/* sub / pre-order */
.banner{background:#fff;color:#000;text-align:center;padding:18px;font:700 14px Oswald,sans-serif;letter-spacing:.3em;text-transform:uppercase}
.ptop{display:flex;justify-content:space-between;align-items:center;padding:32px 40px 0}
.num{font:700 56px/1 Oswald,Impact,sans-serif}
.cover{max-width:1040px;margin:24px auto 0;padding:14px;background:#0b0b0b;border:1px solid #2a2a2a;position:relative}
.mos{display:grid;grid-template-columns:1fr 1.3fr 1.2fr 1fr;grid-template-rows:200px 200px;gap:8px}
.mos .ph:nth-child(1),.mos .ph:nth-child(5){grid-row:span 2}
.ct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(40px,9vw,100px);text-shadow:0 0 40px #000;pointer-events:none}
.meta{max-width:1040px;margin:0 auto;padding:34px 14px;display:grid;grid-template-columns:1fr auto 1fr;gap:24px;align-items:center}
.meta .r{text-align:right;font:700 15px Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.vid{aspect-ratio:3/4;position:relative;border:1px solid #2a2a2a;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:26px;text-align:center;font-size:36px;cursor:pointer}
.vid:hover{border-color:#fff}
.vid small{font:500 14px Oswald,sans-serif;letter-spacing:.3em;color:#bbb;margin-bottom:6px}
.play{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:22px;padding-left:4px}
.feat{display:grid;grid-template-columns:1fr 1fr;border:1px solid #2a2a2a;margin-bottom:28px;min-height:380px;background:#0a0a0a}
.feat .ft{padding:44px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:14px}
.feat h3{font-size:clamp(34px,4.5vw,56px)}
.feat p{color:#bbb;max-width:420px}
.feat .ph{min-height:300px}.feat:nth-of-type(even) .ph{order:-1}
.story{font:500 clamp(24px,3.2vw,38px)/1.4 Oswald,Arial,sans-serif;color:#eee;max-width:1000px;text-transform:none}
.tabs{display:flex;gap:30px;margin-bottom:34px;border-bottom:1px solid #222}
.tabs a{padding:12px 0;font:700 15px Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9a9a9a;border-bottom:2px solid transparent}
.tabs a.on{color:#fff;border-color:#fff}
.mas{columns:3 260px;column-gap:14px}.mas .ph{margin-bottom:14px;border:1px solid #222}
.trk{display:flex;justify-content:space-between;padding:20px 4px;border-bottom:1px solid #222;cursor:pointer;font:500 20px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.04em}
.trk:hover{background:#0f0f0f}
.player{position:sticky;bottom:16px;background:#fff;color:#000;padding:14px 26px;display:flex;gap:18px;align-items:center;margin-top:30px;font-weight:700}
.sub{position:relative;min-height:46vh;display:flex;align-items:flex-end;border-bottom:1px solid #222}
.sub::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,#000)}
.sub .in{position:relative;z-index:1;padding:0 40px 56px}
.sub h1{font-size:clamp(40px,7vw,96px);margin-bottom:14px}
/* release */
.rtop{position:sticky;top:0;z-index:20;height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 40px;background:#000;border-bottom:1px solid #222}
.rh{min-height:82vh;padding:0 56px 100px;display:flex;flex-direction:column;justify-content:flex-end;gap:18px;position:relative}
.rh::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85),transparent 70%),linear-gradient(transparent 50%,#000)}
.rh>*{position:relative;z-index:1}
.rh h1{font-size:clamp(46px,8vw,104px);max-width:900px}.rh p{max-width:540px;color:#ccc;font-size:19px}
.alt{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;padding:70px 56px;border-top:1px solid #151515}
.alt:nth-child(odd) .at{order:2}
.alt h2{font-size:clamp(34px,4vw,54px);margin-bottom:18px}.alt p{color:#bbb;font-size:18px;max-width:520px}
.alt .ph{aspect-ratio:16/10;border:1px solid #222}
.buy{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;padding:0 56px}
.bc{border:1px solid #2a2a2a;background:#0a0a0a;padding:26px;display:flex;flex-direction:column;gap:12px}
.bc .ph{aspect-ratio:16/10}.bc h3{font-size:30px}
.esrb{margin:70px auto;width:300px;border:1px solid #2a2a2a;padding:16px;display:flex;gap:14px;font-size:11px;color:#bbb}
.esrb b{background:#fff;color:#000;font:700 34px Oswald,sans-serif;padding:2px 10px;height:fit-content}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;color:#000;padding:13px 26px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:40}
@media(max-width:820px){.wrap,header,.ptop,.rtop{padding-left:20px;padding-right:20px}nav{display:none}.feat,.alt{grid-template-columns:1fr}.alt{padding:48px 20px;gap:28px}.alt:nth-child(odd) .at{order:0}.feat .ft{padding:28px}.feat:nth-of-type(even) .ph{order:0}.meta{grid-template-columns:1fr;text-align:center}.meta .r{text-align:center}.mos{grid-template-rows:140px 140px}.rh{padding:0 20px 60px}.buy{padding:0 20px}.hero .in{padding:0 20px 60px}.sub .in{padding:0 20px 40px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ===== EDIT YOUR CONTENT HERE =====
   Images: set cover / hero (file path or URL) per game. Without images, grey placeholders are shown. */
var GAMES=[
{id:"aftermath-1",title:"AFTERMATH",num:1,status:"preorder",date:"19 November 2026",platforms:["PC"],tag:"Open World Survival Action RPG",cover:"",hero:"",
 blurb:"Eleven years after the collapse, Velmora belongs to those who survive it.",
 trailers:["Trailer 1","Trailer 2"],preload:false,
 story:"Eleven years after The Collapse, the land of Velmora is a patchwork of ruins, rival factions and hard choices. Survive Ashwood City, Green Valley, the Deadlands, Frostline and Blackwater, and decide who you are when everything has fallen apart.",
 edition:{n:"Ultimate Edition",d:"An exclusive collection of items threaded across all aspects of your story."},
 bonus:{n:"Founder’s Pack",d:"Pre-order to get unique benefits that only early survivors will ever own."}},
{id:"sample-game",title:"SAMPLE GAME",num:0,status:"released",date:"3 March 2024",platforms:["PC","PS5","Xbox Series X|S"],tag:"Now available",cover:"",hero:"",
 blurb:"Replace this entry with your first released title.",
 sections:[["Welcome to the World","Introduce the story, setting and main characters of your released game here."],["Online Mode","Describe multiplayer, co-op or live content here."],["Stunning Visuals","Talk about graphics, performance and platform features."],["Immersive Audio","Describe the soundtrack and sound design."]],
 editions:[["Standard Edition","Includes the full game"],["Deluxe Edition","Includes bonus content"]]}
];
var NEWS=[["Announcement","Welcome to IconicGames","Our new home for games, updates and behind-the-scenes stories.","18 November 2026"],["Dev Diary","Building the world of Velmora","A first look at regions, factions and the systems that bring them to life.","12 November 2026"],["Community","Join the conversation","Follow us for previews and ways to take part in development.","5 November 2026"]];
/* ================================== */
var app=document.getElementById("app"),mtab="Featured",playing=-1;
var TONES=[["#262626","#161616"],["#1b1b1b","#111"],["#2e2e2e","#1a1a1a"],["#202020","#131313"],["#2a2a2a","#181818"],["#171717","#0e0e0e"],["#333","#1c1c1c"]];
function rom(n){return["","I","II","III","IV","V","VI","VII","VIII","IX","X"][n]||String(n)}
function ph(i,x,img){var t=TONES[(i||0)%TONES.length];return'<div class="ph" style="--a:'+t[0]+';--b:'+t[1]+';'+(img?'background:url('+img+') center/cover;':'')+(x||"")+'"></div>'}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.opacity=1;setTimeout(function(){e.style.opacity=0},1800)}
function find(id){return GAMES.filter(function(g){return g.id===id})[0]}
function heroBg(g){return g.hero?'background-image:url('+g.hero+')':'background:linear-gradient(135deg,#2b2b2b,#0a0a0a)'}
function head(on){return'<header><a class="brand" href="#games"><span class="mark">IG</span><span>IconicGames</span></a><nav>'+[["games","Games"],["news","News"],["about","About"]].map(function(t){return'<a href="#'+t[0]+'" class="'+(on===t[0]?"on":"")+'">'+t[1]+'</a>'}).join("")+'</nav><a class="btn sm" href="#newsletter" onclick="go(\'nl\')">Newsletter</a></header>'}
function foot(){return'<footer><div class="wrap"><div><div class="brand" style="margin-bottom:14px"><span class="mark">IG</span><span>IconicGames</span></div><p>© 2026 IconicGames. All rights reserved.</p></div><div><h4>Games</h4>'+GAMES.map(function(g){return'<a href="#'+g.id+'">'+g.title+(g.num?" "+rom(g.num):"")+'</a>'}).join("")+'</div><div><h4>Company</h4><a href="#about">About</a><a href="#news">News</a><a onclick="toast(\'Coming soon\')">Support</a></div><div><h4>Legal</h4><a onclick="toast(\'Coming soon\')">Privacy</a><a onclick="toast(\'Coming soon\')">Terms</a><a onclick="toast(\'Coming soon\')">Imprint</a></div></div></footer>'}
function newsGrid(){return'<div class="grid">'+NEWS.map(function(n,i){return'<a class="nc">'+ph(i)+'<div class="tx"><span class="k">'+n[0]+'</span><h3>'+n[1]+'</h3><p>'+n[2]+'</p><p style="margin-top:10px">'+n[3]+'</p></div></a>'}).join("")+'</div>'}
function nl(){return'<div class="band" id="nl"><div class="wrap"><div><h2 class="d">Stay informed</h2><p>Get game announcements, updates and special offers from IconicGames.</p></div><form onsubmit="event.preventDefault();toast(\'Thank you for subscribing!\')"><input type="email" placeholder="Email address" aria-label="Email address" required><button class="btn" type="submit">Subscribe</button></form></div></div>'}
function go(id){var e=document.getElementById(id);if(e)e.scrollIntoView()}

function vGames(){
 var f=GAMES.filter(function(g){return g.status==="preorder"})[0]||GAMES[0];
 var h=head("games")+'<div class="hero" style="'+heroBg(f)+'"><div class="in"><small>'+(f.status==="preorder"?"Coming "+f.date:"Available now")+'</small><h1 class="d">'+f.title+(f.num?" "+rom(f.num):"")+'</h1><p>'+f.blurb+'</p><div class="row"><a class="btn s" href="#'+f.id+'">'+(f.status==="preorder"?"Pre-order now":"Learn more")+'</a><a class="btn" href="#'+f.id+'">Discover</a></div></div></div><div class="wrap"><section id="games"><div class="sh"><h2 class="d">Games</h2></div><div class="grid">';
 GAMES.forEach(function(g,i){h+='<a class="gc" href="#'+g.id+'"><div class="pic">'+(g.cover?'<img src="'+g.cover+'" alt="">':ph(i))+'<div class="tt d">'+g.title+(g.num?" "+rom(g.num):"")+'</div></div><div class="lb">'+(g.status==="preorder"?"Pre-order · "+g.date:"Available now")+'</div><p>'+g.tag+'</p></a>'});
 return h+'</div></section><section style="padding-top:0"><div class="sh"><h2 class="d">Latest news</h2><a href="#news">View all →</a></div>'+newsGrid()+'</section></div>'+nl()+foot()}
function vNews(){return head("news")+'<div class="wrap"><section><div class="sh"><h2 class="d">News</h2></div>'+newsGrid()+'</section></div>'+nl()+foot()}
function vAbout(){return head("about")+'<div class="wrap about"><section><div class="sh"><h2 class="d">About IconicGames</h2></div><p>IconicGames is an independent studio making ambitious, story-driven games with a strong sense of place.</p><p>We develop our games in-house, from first concept to launch. Every project starts with one question: what would make this unforgettable?</p></section></div>'+foot()}

function pTop(g,sub){return'<div class="ptop"><a href="#'+(sub?g.id:"games")+'" class="num">'+(g.num?rom(g.num):"IG")+'</a>'+(sub?'<span class="d" style="font-size:22px;color:#bbb">'+sub+'</span>':"")+'<span style="display:flex;gap:16px;align-items:center">'+(sub?'<a class="btn sm s" onclick="toast(\'Pre-orders open soon\')">Pre-Order Now</a>':"")+'<a href="#games" class="brand"><span class="mark">IG</span></a></span></div>'}
function vPre(g){
 var tiles=[0,1,2,3,4,5,6].map(function(i){return ph(i+g.id.length)}).join("");
 var tr=g.trailers.slice();if(g.preload)tr.unshift("Pre-Load Now");
 var h='<div class="banner">Last chance for pre-order bonuses</div>'+pTop(g)+'<div class="cover"><div class="mos">'+tiles+'</div><div class="ct d">'+g.title+'</div></div><div class="meta"><div class="d" style="font-size:30px;line-height:1.15">Coming<br>'+g.date+'</div><a class="btn s" onclick="toast(\'Pre-orders open soon\')">Pre-Order Now</a><div class="r">'+g.platforms.join(" &nbsp;·&nbsp; ")+'</div></div><div class="wrap">';
 if(tr.length)h+='<section style="padding:30px 0 60px"><div class="vids">'+tr.map(function(t,i){return'<a class="vid d" onclick="toast(\'Trailer coming soon\')">'+ph(i,"position:absolute;inset:0;opacity:.9")+'<span class="play">▶</span><small style="position:relative">Watch</small><span style="position:relative">'+t+'</span></a>'}).join("")+'</div></section>';
 function feat(k,n,d,i,sub,btn){return'<div class="feat"><div class="ft"><span class="k">'+k+'</span><h3 class="d">'+n+'</h3><p>'+d+'</p><a class="btn" '+(sub?'href="#'+g.id+'-'+sub+'"':'onclick="toast(\'Pre-orders open soon\')"')+'>'+btn+' →</a></div>'+ph(i)+'</div>'}
 h+=feat("Pre-order",g.edition.n,g.edition.d,0,"","Learn more")+feat("Pre-order bonuses",g.bonus.n,g.bonus.d,1,"","Learn more");
 h+='<section><div class="sh"><h2 class="d">'+g.tag+'</h2></div><p class="story">'+g.story+'</p></section>';
 h+=feat("Music","In-game radio and soundtrack",g.title+" soundtrack previews.",2,"music","Explore more")+feat("Screenshots","The launch gallery","A stunning look inside the world with new screenshots.",3,"gallery","View all")+feat("Downloads","Media &amp; artwork","Download and share official videos, screenshots and more.",4,"media","See all");
 h+='<section><div class="sh"><h2 class="d">Featured news</h2><a href="#news">View all →</a></div>'+newsGrid()+'</section></div>'+nl()+foot();return h}
function vSub(g,kind){
 var t=kind==="music"?"Music":kind==="gallery"?"The Launch Gallery":"Media";
 var h='<div class="banner">Last chance for pre-order bonuses</div>'+pTop(g,t)+'<div class="sub" style="'+heroBg(g)+'"><div class="in"><h1 class="d">'+(kind==="music"?"The music of "+g.title:kind==="gallery"?"The launch gallery":"Explore "+g.title)+'</h1><p class="mut" style="max-width:520px;font-size:18px">'+(kind==="music"?"Hear singles from the soundtrack and select in-game radio stations.":kind==="gallery"?"Explore the world through new screenshots.":"Download and share trailers, imagery and more.")+'</p></div></div><div class="wrap"><section>';
 if(kind==="music"){h+=["Radio Station 1","Radio Station 2","Official Score"].map(function(n,i){return'<div class="trk" onclick="playing='+i+';route()"><span>'+(playing===i?"❚❚ ":"▶ ")+n+'</span><span class="mut">Preview 2:06</span></div>'}).join("")+(playing>=0?'<div class="player"><span>▶ Now playing</span><span style="font-weight:400">Track '+(playing+1)+' · Preview</span></div>':"")}
 else if(kind==="gallery"){h+='<div class="mas">'+[300,220,380,260,340,240,300,360,230].map(function(x,i){return ph(i,"height:"+x+"px")}).join("")+'</div>'}
 else{h+='<div class="tabs">'+["Featured","Videos","Screenshots","Artwork"].map(function(n){return'<a class="'+(n===mtab?"on":"")+'" onclick="mtab=\''+n+'\';route()">'+n+'</a>'}).join("")+'</div>';
  if(mtab==="Featured"||mtab==="Videos")h+='<div class="sh"><h2 class="d">Videos</h2></div><div class="grid">'+g.trailers.map(function(n,i){return'<a class="nc" onclick="toast(\'Trailer coming soon\')">'+ph(i)+'<div class="tx"><h3>'+g.title+": "+n+'</h3><p>1 size</p></div></a>'}).join("")+'</div>';
  if(mtab!=="Videos")h+='<div class="sh" style="margin-top:50px"><h2 class="d">'+(mtab==="Artwork"?"Artwork":"Screenshots")+'</h2></div><div class="grid">'+[1,2,3,4,5,6].slice(0,mtab==="Featured"?3:6).map(function(s,i){return'<div class="nc">'+ph(i+2)+'</div>'}).join("")+'</div>'}
 return h+'</section></div>'+foot()}

function vRel(g){
 var sec=g.sections.map(function(s,i){return'<div class="alt" id="s'+i+'"><div class="at"><h2 class="d">'+s[0]+'</h2><p>'+s[1]+'</p></div>'+ph(i)+'</div>'}).join("");

 '<div class="rh" style="'+heroBg(g)+';background-size:cover"><span class="k">'+g.title+'</span><h1 class="d">Now available for '+g.platforms.join(", ")+'</h1><p>'+g.blurb+'</p><div style="display:flex;gap:14px;flex-wrap:wrap"><a class="btn" onclick="toast(\'Trailer coming soon\')">Watch the trailer</a><a class="btn s" onclick="go(\'buy\')">Buy now</a></div></div>'+sec+
 '<h2 id="buy" class="d" style="padding:64px 56px 28px;font-size:44px">Buy now</h2><div class="buy">'+ed+'</div><div class="esrb"><b>M</b><span>Rating information goes here. Replace with the official age rating of your game.</span></div>'+foot()}
function route(){
 var h=location.hash.slice(1)||"games",m=h.match(/^(.+)-(music|gallery|media)$/),g=m?find(m[1]):find(h),v;
 if(m&&g)v=vSub(g,m[2]);
 else if(g)v=g.status==="preorder"?vPre(g):vRel(g);
 else v=h==="news"?vNews():h==="about"?vAbout():vGames();
 app.innerHTML=v;
}
window.addEventListener("hashchange",function(){playing=-1;mtab="Featured";route();window.scrollTo(0,0)});route();
