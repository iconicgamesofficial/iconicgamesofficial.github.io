<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="IconicGames — Independent games. Unforgettable worlds.">
<title>IconicGames — Independent Games Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#090a0d;
--panel:#101216;
--panel2:#15181e;
--line:rgba(255,255,255,.11);
--muted:#9298a3;
--white:#f4f5f6;
--accent:#d8ff3e;
--max:1440px;
--pad:clamp(22px,5vw,82px);
--display:"Oswald",Impact,sans-serif;
--body:"Manrope",Arial,sans-serif;
--mono:"DM Mono",monospace
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
background:var(--bg);
color:var(--white);
font:15px/1.7 var(--body);
-webkit-font-smoothing:antialiased;
overflow-x:hidden
}
body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
z-index:30;
opacity:.13;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")
}
a{color:inherit;text-decoration:none;cursor:pointer}
button,input{font:inherit}
.display{
font-family:var(--display);
text-transform:uppercase;
font-weight:700;
line-height:.94;
letter-spacing:-.025em
}
.mono,.eyebrow{
font-family:var(--mono);
text-transform:uppercase;
letter-spacing:.14em;
font-size:10px
}
.muted{color:var(--muted)}
.wrap{max-width:var(--max);margin:auto;padding:0 var(--pad)}
.accent{color:var(--accent)}
.eyebrow{
color:var(--accent);
display:flex;
align-items:center;
gap:12px
}
.eyebrow:before{
content:"";
width:24px;
height:1px;
background:currentColor
}

header,.rtop{
height:82px;
position:sticky;
top:0;
z-index:20;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 var(--pad);
background:rgba(9,10,13,.82);
backdrop-filter:blur(22px);
border-bottom:1px solid var(--line)
}
.brand{display:flex;align-items:center;gap:13px}
.mark{
width:38px;
height:38px;
display:grid;
place-items:center;
background:var(--accent);
color:#08090b;
font:700 17px var(--display);
letter-spacing:-.05em;
transform:skew(-7deg)
}
.brandname{
font:700 19px var(--display);
letter-spacing:.08em;
text-transform:uppercase
}
.brandname span{color:var(--accent)}
nav{display:flex;gap:clamp(18px,3vw,44px)}
nav a{
font-size:10px;
font-weight:800;
letter-spacing:.16em;
text-transform:uppercase;
color:#a9adb5;
transition:.2s
}
nav a:hover,nav a.on{color:var(--white)}
nav a.on:after{
content:"";
display:block;
height:2px;
background:var(--accent);
margin-top:8px
}
.header-right{display:flex;align-items:center;gap:18px}
.availability{
font:10px var(--mono);
color:#aeb3bd;
letter-spacing:.1em
}
.availability i{
display:inline-block;
width:7px;
height:7px;
border-radius:50%;
background:var(--accent);
margin-right:8px;
box-shadow:0 0 12px var(--accent)
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
gap:18px;
min-height:52px;
padding:0 23px;
border:1px solid var(--line);
background:transparent;
color:var(--white);
font:700 10px var(--mono);
letter-spacing:.12em;
text-transform:uppercase;
transition:transform .2s,border-color .2s,background .2s,color .2s
}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.primary{
background:var(--accent);
border-color:var(--accent);
color:#08090b
}
.btn.primary:hover{background:#e6ff80}
.btn.small{min-height:40px;padding:0 16px}
.arrow{font-size:17px;line-height:0}

.hero{
min-height:min(850px,calc(100svh - 82px));
position:relative;
display:flex;
align-items:flex-end;
overflow:hidden;
background:#11151a;
background-size:cover;
background-position:center
}
.hero:before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(90deg,rgba(5,7,10,.96) 0%,rgba(5,7,10,.72) 44%,rgba(5,7,10,.08) 100%),
linear-gradient(0deg,#090a0d 0%,transparent 52%)
}
.hero:after{
content:"";
position:absolute;
inset:0;
background:radial-gradient(ellipse at 76% 35%,rgba(216,255,62,.09),transparent 34%);
pointer-events:none
}
.hero-inner{
position:relative;
z-index:1;
width:100%;
max-width:var(--max);
margin:auto;
padding:110px var(--pad) 105px
}
.hero-copy{max-width:790px}
.hero h1{
font-size:clamp(76px,13.2vw,190px);
margin:27px 0 28px;
letter-spacing:-.045em
}
.hero h1 span{
display:block;
color:transparent;
-webkit-text-stroke:1px rgba(255,255,255,.72)
}
.hero p{
max-width:480px;
color:#c2c6cd;
font-size:16px;
line-height:1.85;
margin-bottom:34px
}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.hero-foot{
position:absolute;
z-index:2;
right:var(--pad);
bottom:42px;
display:flex;
align-items:center;
gap:18px;
color:#9ca2ac
}
.hero-foot:before{
content:"";
height:1px;
width:54px;
background:var(--accent)
}
.hero-index{
position:absolute;
right:var(--pad);
top:50%;
transform:translateY(-50%);
font:11px var(--mono);
color:#777f8b;
writing-mode:vertical-rl;
letter-spacing:.18em
}

section{padding:110px 0}
.section-head{
display:flex;
align-items:end;
justify-content:space-between;
gap:30px;
margin-bottom:38px;
padding-bottom:22px;
border-bottom:1px solid var(--line)
}
.section-head h2{font-size:clamp(43px,6vw,76px)}
.section-head p{
max-width:350px;
color:var(--muted);
font-size:13px
}
.games-grid{
display:grid;
grid-template-columns:1.35fr 1fr;
gap:22px
}
.game-card{
position:relative;
min-height:540px;
overflow:hidden;
background:var(--panel);
border:1px solid var(--line);
isolation:isolate
}
.game-card:nth-child(n+2){min-height:260px}
.game-card .art{
position:absolute;
inset:0;
background:linear-gradient(135deg,#242b31,#0d1014);
transition:transform .7s cubic-bezier(.2,.7,.2,1)
}
.game-card .art:before{
content:"";
position:absolute;
inset:0;
background:
radial-gradient(ellipse at 70% 32%,rgba(216,255,62,.12),transparent 34%),
linear-gradient(0deg,rgba(4,5,7,.98),transparent 72%)
}
.game-card:hover .art{transform:scale(1.045)}
.game-card .card-top{
position:absolute;
top:24px;
left:26px;
right:26px;
display:flex;
justify-content:space-between;
align-items:center
}
.tag{
border:1px solid rgba(255,255,255,.22);
padding:7px 10px;
color:#d5d9df;
font:9px var(--mono);
letter-spacing:.1em;
text-transform:uppercase;
background:rgba(0,0,0,.2)
}
.game-card .card-content{
position:absolute;
left:30px;
right:30px;
bottom:30px
}
.game-card h3{
font-size:clamp(43px,6vw,78px);
margin:12px 0
}
.game-card p{
max-width:420px;
color:#aeb4be;
font-size:13px
}
.card-link{
position:absolute;
right:30px;
bottom:35px;
width:48px;
height:48px;
border:1px solid rgba(255,255,255,.4);
display:grid;
place-items:center;
font-size:20px;
transition:.2s
}
.game-card:hover .card-link{
background:var(--accent);
color:#08090b;
border-color:var(--accent)
}
.game-card.secondary{min-height:260px}
.games-side{display:grid;gap:22px}
.games-side .game-card .card-content{bottom:24px}
.games-side .game-card h3{font-size:45px}

.manifesto{
background:var(--accent);
color:#090a0d;
padding:clamp(55px,8vw,112px) 0;
position:relative;
overflow:hidden
}
.manifesto:after{
content:"IG";
position:absolute;
right:-20px;
bottom:-150px;
font:700 440px/.8 var(--display);
color:rgba(0,0,0,.055);
pointer-events:none
}
.manifesto .eyebrow{color:#343b17}
.manifesto .eyebrow:before{background:#343b17}
.manifesto h2{
font-size:clamp(48px,8vw,108px);
max-width:1050px;
margin:28px 0
}
.manifesto p{
max-width:570px;
color:#333a1d;
font-size:15px
}

.news-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px
}
.news-card{
border:1px solid var(--line);
background:var(--panel);
transition:.25s
}
.news-card:hover{
transform:translateY(-5px);
border-color:rgba(216,255,62,.55)
}
.news-art{
aspect-ratio:16/10;
background:linear-gradient(135deg,#20262b,#0c0f12);
position:relative;
overflow:hidden
}
.news-art:before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(135deg,transparent 35%,rgba(216,255,62,.14)),
repeating-linear-gradient(135deg,transparent 0 24px,rgba(255,255,255,.035) 25px 26px)
}
.news-copy{padding:23px}
.news-copy h3{
font:600 25px/1.15 var(--display);
text-transform:uppercase;
margin:13px 0
}
.news-copy p{color:var(--muted);font-size:12px}
.news-date{
margin-top:18px;
padding-top:14px;
border-top:1px solid var(--line);
color:#747b85;
font:9px var(--mono);
letter-spacing:.1em
}

.newsletter{
padding:70px 0;
border-top:1px solid var(--line);
border-bottom:1px solid var(--line);
background:linear-gradient(110deg,#14191b,#0d0f12)
}
.newsletter-inner{
display:flex;
align-items:center;
justify-content:space-between;
gap:40px
}
.newsletter h2{
font-size:clamp(38px,5vw,62px);
margin:12px 0
}
.newsletter p{color:var(--muted);font-size:13px}
.newsletter form{
display:flex;
width:min(470px,100%);
border-bottom:1px solid #646b74
}
.newsletter input{
flex:1;
min-width:0;
padding:17px 4px;
background:transparent;
border:0;
outline:0;
color:#fff;
font-size:13px
}
.newsletter input::placeholder{color:#727985}
.newsletter button{
border:0;
background:transparent;
color:var(--accent);
font:10px var(--mono);
letter-spacing:.12em;
text-transform:uppercase;
cursor:pointer;
padding:0 5px
}

.about-grid{
display:grid;
grid-template-columns:.75fr 1.25fr;
gap:80px
}
.about-grid h2{font-size:clamp(45px,6vw,75px)}
.about-copy{
font-size:clamp(17px,2vw,22px);
line-height:1.75;
color:#c5cad1
}
.about-copy p+p{margin-top:24px}
.values{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-top:55px
}
.value{
padding:22px;
border-top:1px solid var(--line)
}
.value b{
font:24px var(--display);
text-transform:uppercase;
display:block;
margin:12px 0
}
.value span{font-size:11px;color:var(--muted)}

footer{
padding:55px 0 28px;
border-top:1px solid var(--line);
color:var(--muted)
}
.footer-top{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr;
gap:35px;
padding-bottom:60px
}
.footer-brand p{
max-width:280px;
margin-top:20px;
font-size:12px
}
.footer-col h4{
font:10px var(--mono);
color:#fff;
letter-spacing:.16em;
text-transform:uppercase;
margin-bottom:18px
}
.footer-col a{
display:block;
font-size:12px;
margin:10px 0;
transition:.2s
}
.footer-col a:hover{color:var(--accent)}
.footer-bottom{
display:flex;
justify-content:space-between;
gap:20px;
padding-top:22px;
border-top:1px solid var(--line);
font:9px var(--mono);
letter-spacing:.1em;
text-transform:uppercase
}

.subhero{
min-height:52vh;
display:flex;
align-items:end;
position:relative;
background:linear-gradient(90deg,#0a0c0f,#171d20);
border-bottom:1px solid var(--line);
overflow:hidden
}
.subhero:after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(0deg,var(--bg),transparent 80%),
radial-gradient(ellipse at 75% 25%,rgba(216,255,62,.1),transparent 40%)
}
.subhero .inner{
position:relative;
z-index:1;
padding:90px var(--pad) 65px;
width:100%;
max-width:var(--max);
margin:auto
}
.subhero h1{
font-size:clamp(58px,10vw,130px);
margin:20px 0
}
.subhero p{max-width:560px;color:#b9c0c9}
.detail-top{
display:flex;
align-items:center;
justify-content:space-between;
padding:25px var(--pad);
border-bottom:1px solid var(--line)
}
.detail-top .num{font:38px var(--display)}
.detail-cover{
max-width:1200px;
margin:30px auto;
padding:0 var(--pad);
position:relative
}
.mosaic{
height:460px;
display:grid;
grid-template-columns:1fr 1.3fr 1fr;
grid-template-rows:1fr 1fr;
gap:8px
}
.mosaic div{
background:linear-gradient(135deg,#242b31,#0d1014);
border:1px solid var(--line)
}
.mosaic div:first-child{grid-row:span 2}
.mosaic div:nth-child(4){grid-column:span 2}
.cover-title{
position:absolute;
inset:0;
display:grid;
place-items:center;
text-align:center;
font-size:clamp(45px,9vw,110px);
text-shadow:0 5px 35px #000
}
.detail-meta{
max-width:1200px;
margin:auto;
padding:20px var(--pad) 55px;
display:flex;
justify-content:space-between;
align-items:center;
gap:20px
}
.feature-row{
display:grid;
grid-template-columns:1fr 1fr;
min-height:330px;
border:1px solid var(--line);
margin:20px 0;
background:var(--panel)
}
.feature-row:nth-child(even) .feature-art{order:-1}
.feature-copy{
padding:clamp(25px,5vw,55px);
display:flex;
flex-direction:column;
align-items:start;
justify-content:center
}
.feature-copy h3{
font-size:clamp(35px,5vw,60px);
margin:15px 0
}
.feature-copy p{
color:var(--muted);
max-width:420px;
margin-bottom:24px
}
.feature-art{
min-height:260px;
background:linear-gradient(135deg,#283035,#101316);
position:relative
}
.story-copy{
max-width:900px;
font:500 clamp(22px,3vw,36px)/1.5 var(--display);
color:#dce0e5
}
.gallery-grid{
columns:3 230px;
column-gap:12px
}
.gallery-grid div{
height:220px;
margin:0 0 12px;
background:linear-gradient(135deg,#252b31,#101316);
border:1px solid var(--line);
break-inside:avoid
}
.tabs{
display:flex;
gap:25px;
border-bottom:1px solid var(--line);
margin-bottom:30px
}
.tabs a{
padding:12px 0;
color:var(--muted);
font:10px var(--mono);
letter-spacing:.1em;
text-transform:uppercase
}
.tabs a.on{
color:var(--accent);
border-bottom:2px solid var(--accent)
}
.track{
display:flex;
justify-content:space-between;
padding:20px 5px;
border-bottom:1px solid var(--line);
font:18px var(--display);
text-transform:uppercase;
cursor:pointer
}
.track:hover{color:var(--accent)}
.purchase-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:16px
}
.purchase-card{
padding:25px;
border:1px solid var(--line);
background:var(--panel)
}
.purchase-card h3{
font:30px var(--display);
text-transform:uppercase;
margin:20px 0 8px
}
.purchase-card p{
color:var(--muted);
font-size:12px;
margin-bottom:20px
}
.purchase-art{
aspect-ratio:16/9;
background:linear-gradient(135deg,#283035,#101316)
}
.toast{
position:fixed;
left:50%;
bottom:25px;
transform:translate(-50%,20px);
background:var(--accent);
color:#090a0d;
padding:13px 22px;
font:10px var(--mono);
letter-spacing:.08em;
text-transform:uppercase;
opacity:0;
pointer-events:none;
transition:.25s;
z-index:50
}
.toast.show{
opacity:1;
transform:translate(-50%,0)
}

@media(max-width:850px){
nav{display:none}
.availability{display:none}
.games-grid{grid-template-columns:1fr}
.game-card{min-height:450px}
.games-side{grid-template-columns:1fr 1fr}
.games-side .game-card{min-height:270px}
.news-grid{grid-template-columns:1fr 1fr}
.about-grid{grid-template-columns:1fr;gap:25px}
.footer-top{grid-template-columns:1.5fr 1fr 1fr}
.footer-brand{grid-column:1/-1}
.newsletter-inner{align-items:flex-start;flex-direction:column}
.newsletter form{max-width:560px}
.hero-index{display:none}
}

@media(max-width:560px){
header,.rtop{height:70px}
.brandname{font-size:16px}
.header-right .btn{min-height:38px;padding:0 11px;font-size:9px}
.hero{min-height:720px}
.hero-inner{padding-top:100px;padding-bottom:90px}
.hero h1{font-size:clamp(68px,18vw,100px)}
.hero-foot{display:none}
section{padding:75px 0}
.section-head{align-items:start;flex-direction:column}
.section-head p{max-width:100%}
.games-side,.news-grid{grid-template-columns:1fr}
.game-card,.game-card.secondary{min-height:390px}
.games-side .game-card{min-height:330px}
.game-card .card-content{left:22px;right:22px;bottom:24px}
.card-link{right:22px;bottom:24px}
.game-card p{max-width:80%}
.values{grid-template-columns:1fr}
.footer-top{grid-template-columns:1fr 1fr}
.footer-brand{grid-column:1/-1}
.footer-bottom{flex-direction:column}
.detail-meta{align-items:flex-start;flex-direction:column}
.mosaic{
height:300px;
grid-template-columns:1fr 1fr
}
.mosaic div:nth-child(4){grid-column:auto}
.feature-row{grid-template-columns:1fr}
.feature-row:nth-child(even) .feature-art{order:0}
.feature-art{min-height:210px}
.subhero{min-height:420px}
.subhero .inner{padding-bottom:45px}
.detail-cover{margin-top:20px}
.tabs{gap:15px;overflow:auto}
.tabs a{white-space:nowrap}
}

@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
*,*:before,*:after{transition:none!important;animation:none!important}
}
</style>
</head>

function rom(n){
return["","I","II","III","IV","V","VI","VII","VIII","IX","X"][n]||String(n)
}

function toast(t){
var e=document.getElementById("toast");
e.textContent=t;
e.classList.add("show");
clearTimeout(window.__toastTimer);
window.__toastTimer=setTimeout(function(){
e.classList.remove("show")
},2200)
}

function find(id){
return GAMES.find(function(g){
return g.id===id
})
}

function heroBg(g){
return g.hero
?'background-image:linear-gradient(90deg,rgba(5,7,10,.94),rgba(5,7,10,.2)),url('+g.hero+')'
:'background-image:radial-gradient(ellipse at 72% 28%,rgba(216,255,62,.16),transparent 30%),linear-gradient(125deg,#20272d,#0b0e11 65%)'
}

/* HEADER */

function head(on){
return '<header>'+
'<a class="brand" href="#games">'+
'<span class="mark">IG</span>'+
'<span class="brandname">ICONIC<span>GAMES</span></span>'+
'</a>'+
'<nav>'+
[["games","Games"],["news","News"],["about","Studio"]].map(function(t){
return '<a href="#'+t[0]+'" class="'+(on===t[0]?"on":"")+'">'+t[1]+'</a>'
}).join("")+
'</nav>'+
'<div class="header-right">'+
'<span class="availability"><i></i>INDEPENDENT GAME STUDIO</span>'+
'<a class="btn primary small" href="#newsletter">Get updates <span class="arrow">↗</span></a>'+
'</div>'+
'</header>'
}

/* FOOTER */

function foot(){
return '<footer><div class="wrap">'+
'<div class="footer-top">'+
'<div class="footer-brand">'+
'<div class="brand"><span class="mark">IG</span><span class="brandname">ICONIC<span>GAMES</span></span></div>'+
'<p>Independent games. Unforgettable worlds. We build ambitious experiences made to stay with you.</p>'+
'</div>'+
'<div class="footer-col"><h4>Explore</h4><a href="#games">Our games</a><a href="#news">Latest news</a><a href="#about">The studio</a></div>'+
'<div class="footer-col"><h4>Connect</h4><a onclick="toast(\'Social channels coming soon\')">Community</a><a onclick="toast(\'Contact details coming soon\')">Contact</a><a onclick="toast(\'Support portal coming soon\')">Support</a></div>'+
'<div class="footer-col"><h4>Information</h4><a onclick="toast(\'Privacy policy coming soon\')">Privacy</a><a onclick="toast(\'Terms coming soon\')">Terms</a><a onclick="toast(\'Legal information coming soon\')">Legal</a></div>'+
'</div>'+
'<div class="footer-bottom"><span>© 2026 ICONICGAMES. ALL RIGHTS RESERVED.</span><span>BUILT FOR THE WORLDS WE IMAGINE.</span></div>'+
'</div></footer>'
}

/* NEWS */

function newsGrid(){
return '<div class="news-grid">'+
NEWS.map(function(n,i){
return '<a class="news-card" href="#news">'+
'<div class="news-art" style="background-position:'+((i+1)*30)+'% center"></div>'+
'<div class="news-copy">'+
'<span class="eyebrow">'+n[0]+'</span>'+
'<h3>'+n[1]+'</h3>'+
'<p>'+n[2]+'</p>'+
'<div class="news-date">'+n[3]+' <span style="float:right;color:var(--accent)">READ STORY ↗</span></div>'+
'</div></a>'
}).join("")+
'</div>'
}

/* NEWSLETTER */

function nl(){
return '<div class="newsletter" id="newsletter">'+
'<div class="wrap newsletter-inner">'+
'<div>'+
'<span class="eyebrow">THE ICONIC DISPATCH</span>'+
'<h2 class="display">Stay in the loop<span class="accent">.</span></h2>'+
'<p>Game reveals, development notes and studio news. Only when it matters.</p>'+
'</div>'+
'<form onsubmit="event.preventDefault();toast(\'Subscription form needs an email service to go live\')">'+
'<input type="email" placeholder="Your email address" aria-label="Your email address" required>'+
'<button type="submit">Subscribe ↗</button>'+
'</form>'+
'</div></div>'
}

/* GAME CARDS */

function gameCard(g,i,large){
return '<a class="game-card '+(large?'':'secondary')+'" href="#'+g.id+'">'+
'<div class="art" style="'+(g.cover?'background-image:url('+g.cover+');background-size:cover;background-position:center':'')+'"></div>'+
'<div class="card-top">'+
'<span class="tag">'+(g.status==="preorder"?"UPCOMING RELEASE":"AVAILABLE NOW")+'</span>'+
'<span class="mono muted">'+(g.num?"IG / "+rom(g.num):"IG / 00")+'</span>'+
'</div>'+
'<div class="card-content">'+
'<span class="eyebrow">'+g.tag+'</span>'+
'<h3 class="display">'+g.title+(g.num?" "+rom(g.num):"")+'</h3>'+
'<p>'+g.blurb+'</p>'+
'</div>'+
'<span class="card-link">↗</span>'+
'</a>'
}

/* HOME PAGE */

function vGames(){

var f=GAMES.find(function(g){
return g.status==="preorder"
})||GAMES[0];

var rest=GAMES.filter(function(g){
return g.id!==f.id
});

var h=head("games")+
'<div class="hero" style="'+heroBg(f)+'">'+
'<div class="hero-index">01 / FEATURED PROJECT</div>'+
'<div class="hero-inner"><div class="hero-copy">'+
'<span class="eyebrow">'+(f.status==="preorder"?"NEXT RELEASE · "+f.date:"FEATURED PROJECT")+'</span>'+
'<h1 class="display">'+f.title+'<span>'+(f.num?"CHAPTER "+rom(f.num):"")+'</span></h1>'+
'<p>'+f.blurb+'</p>'+
'<div class="hero-actions">'+
'<a class="btn primary" href="#'+f.id+'">'+(f.status==="preorder"?"Explore the game":"Discover the game")+' <span class="arrow">↗</span></a>'+
'<a class="btn" href="#about">Meet the studio <span class="arrow">↗</span></a>'+
'</div></div></div>'+
'<div class="hero-foot mono">A NEW WORLD IS TAKING SHAPE</div>'+
'</div>';

h+='<div class="wrap"><section id="games">'+
'<div class="section-head"><div>'+
'<span class="eyebrow">OUR PORTFOLIO / 001</span>'+
'<h2 class="display">Worlds in <span class="accent">progress.</span></h2>'+
'</div>'+
'<p>Original concepts. Distinct identities. Experiences designed to leave a mark.</p>'+
'</div>'+
'<div class="games-grid">'+
(f?gameCard(f,0,true):"")+
'<div class="games-side">'+
rest.map(function(g,i){
return gameCard(g,i+1,false)
}).join("")+
'</div></div></section></div>';

h+='<div class="manifesto"><div class="wrap">'+
'<span class="eyebrow">OUR POINT OF VIEW</span>'+
'<h2 class="display">Not just games.<br>Worlds worth <span style="color:#fff">getting lost in.</span></h2>'+
'<p>We believe the best games create a feeling you carry long after you put the controller down. That belief drives every world we build.</p>'+
'</div></div>';

h+='<div class="wrap"><section id="news">'+
'<div class="section-head"><div>'+
'<span class="eyebrow">FROM THE STUDIO</span>'+
'<h2 class="display">Latest <span class="accent">intel.</span></h2>'+
'</div>'+
'<a class="btn" href="#news">All updates <span class="arrow">↗</span></a>'+
'</div>'+newsGrid()+
'</section></div>'+nl()+foot();

return h
}

/* NEWS PAGE */

function vNews(){
return head("news")+
'<div class="subhero"><div class="inner">'+
'<span class="eyebrow">THE LATEST FROM ICONICGAMES</span>'+
'<h1 class="display">Studio <span class="accent">updates.</span></h1>'+
'<p>Announcements, development diaries and a closer look at the work behind our games.</p>'+
'</div></div>'+
'<div class="wrap"><section>'+newsGrid()+'</section></div>'+
nl()+foot()
}

/* ABOUT PAGE */

function vAbout(){
return head("about")+
'<div class="subhero"><div class="inner">'+
'<span class="eyebrow">WHO WE ARE</span>'+
'<h1 class="display">Built on <span class="accent">imagination.</span></h1>'+
'<p>An independent game studio focused on creating distinctive worlds and memorable interactive experiences.</p>'+
'</div></div>'+
'<div class="wrap"><section>'+
'<div class="about-grid">'+
'<div><span class="eyebrow">THE STUDIO / 2026</span><h2 class="display">Small team.<br><span class="accent">Big ambition.</span></h2></div>'+
'<div class="about-copy">'+
'<p>IconicGames is an independent studio making ambitious, story-driven games with a strong sense of place.</p>'+
'<p>We develop our games in-house, from first concept to launch. Every project starts with one question: what would make this unforgettable?</p>'+
'</div></div>'+
'<div class="values">'+
'<div class="value"><span class="eyebrow">01 / IDENTITY</span><b>Original worlds</b><span>Distinct settings, characters and stories.</span></div>'+
'<div class="value"><span class="eyebrow">02 / CRAFT</span><b>Made with intent</b><span>Thoughtful design from first idea to final detail.</span></div>'+
'<div class="value"><span class="eyebrow">03 / AMBITION</span><b>Built to matter</b><span>Experiences players remember and return to.</span></div>'+
'</div></section></div>'+
foot()
}

/* GAME DETAIL */

function detailTop(g,sub){
return '<div class="detail-top">'+
'<a href="#games" class="num">'+(g.num?rom(g.num):"IG")+'</a>'+
'<span class="mono muted">'+(sub||"GAME OVERVIEW")+'</span>'+
'<a class="btn small" href="#games">← Back to games</a>'+
'</div>'
}

/* UPCOMING GAME */

function vPre(g){

var h=head("games")+detailTop(g)+
"<div class='detail-cover'>"+
"<div class='mosaic'><div></div><div></div><div></div><div></div><div></div></div>"+
"<div class='cover-title display'>"+g.title+"</div>"+
"</div>"+
"<div class='detail-meta'>"+
"<div><span class='eyebrow'>EXPECTED RELEASE</span>"+
"<div class='display' style='font-size:32px;margin-top:8px'>"+g.date+"</div></div>"+
"<span class='tag'>"+g.platforms.join(" · ")+"</span>"+
"<button class='btn primary' onclick=\"toast('Pre-orders are not connected yet')\">Pre-order information ↗</button>"+
"</div><div class='wrap'>";

if(g.trailers&&g.trailers.length){
h+='<section style="padding-top:35px">'+
'<div class="section-head"><div><span class="eyebrow">WATCH</span><h2 class="display">First <span class="accent">look.</span></h2></div></div>'+
'<div class="purchase-grid">'+
g.trailers.map(function(t){
return '<div class="purchase-card"><div class="purchase-art"></div><h3>'+t+'</h3><p>Official video preview</p><button class="btn" onclick="toast(\'Trailer will be available soon\')">Watch trailer ↗</button></div>'
}).join("")+
'</div></section>'
}

function feature(k,n,d,i){
return '<div class="feature-row">'+
'<div class="feature-copy">'+
'<span class="eyebrow">'+k+'</span>'+
'<h3 class="display">'+n+'</h3>'+
'<p>'+d+'</p>'+
'<button class="btn" onclick="toast(\'More information coming soon\')">Discover more ↗</button>'+
'</div><div class="feature-art"></div>'+
'</div>'
}

h+=feature("PRE-ORDER EDITION",g.edition.n,g.edition.d,0);
h+=feature("EARLY PLAYER REWARD",g.bonus.n,g.bonus.d,1);

h+='<section>'+
'<div class="section-head"><div>'+
'<span class="eyebrow">THE SETTING</span>'+
'<h2 class="display">Your story <span class="accent">starts here.</span></h2>'+
'</div></div>'+
'<p class="story-copy">'+g.story+'</p>'+
'</section></div>'+nl()+foot();

return h
}

/* GAME SUBPAGES */

function vSub(g,kind){

var title=kind==="music"?"The music":kind==="gallery"?"The gallery":"Media centre";

var h=head("games")+detailTop(g,title.toUpperCase())+
'<div class="subhero"><div class="inner">'+
'<span class="eyebrow">'+g.title+' / '+title+'</span>'+
'<h1 class="display">'+title+'<span class="accent">.</span></h1>'+
'<p>Explore more from the world of '+g.title+'.</p>'+
'</div></div><div class="wrap"><section>';

if(kind==="music"){

h+='<div class="section-head"><div>'+
'<span class="eyebrow">ORIGINAL SOUND</span>'+
'<h2 class="display">Listen in.</h2>'+
'</div></div>';

h+=["Radio Station 1","Radio Station 2","Official Score"].map(function(n,i){
return '<div class="track" onclick="playing='+i+';route()">'+
'<span>'+(playing===i?"Ⅱ":"▶")+' &nbsp; '+n+'</span>'+
'<span class="muted mono">PREVIEW · 02:06</span>'+
'</div>'
}).join("");

if(playing>=0){
h+='<p class="muted mono" style="margin-top:20px">SELECTED TRACK '+(playing+1)+' — AUDIO PLAYER NOT CONNECTED</p>'
}

}else if(kind==="gallery"){

h+='<div class="gallery-grid">'+
[1,2,3,4,5,6,7,8,9].map(function(){
return '<div></div>'
}).join("")+
'</div>'

}else{

h+='<div class="tabs">'+
["Featured","Videos","Screenshots","Artwork"].map(function(n){
return '<a class="'+(n===mtab?"on":"")+'" onclick="mtab=\''+n+'\';route()">'+n+'</a>'
}).join("")+
'</div>';

if(mtab==="Featured"||mtab==="Videos"){

h+='<div class="purchase-grid">'+
(g.trailers||[]).map(function(n){
return '<div class="purchase-card">'+
'<div class="purchase-art"></div>'+
'<h3>'+n+'</h3>'+
'<p>Official video</p>'+
'<button class="btn" onclick="toast(\'Video coming soon\')">Watch ↗</button>'+
'</div>'
}).join("")+
'</div>'
}

if(mtab!=="Videos"){

h+='<div class="section-head" style="margin-top:55px">'+
'<h2 class="display">'+(mtab==="Artwork"?"Artwork":"Screenshots")+'</h2>'+
'</div><div class="gallery-grid">'+
[1,2,3,4,5,6].map(function(){
return '<div></div>'
}).join("")+
'</div>'
}

}

return h+'</section></div>'+foot()
}

/* RELEASED GAME */

function vRel(g){

var sec=(g.sections||[]).map(function(s,i){
return '<div class="feature-row" id="s'+i+'">'+
'<div class="feature-copy">'+
'<span class="eyebrow">CHAPTER 0'+(i+1)+'</span>'+
'<h3 class="display">'+s[0]+'</h3>'+
'<p>'+s[1]+'</p>'+
'</div><div class="feature-art"></div>'+
'</div>'
}).join("");

var ed=(g.editions||[]).map(function(e){
return '<div class="purchase-card">'+
'<div class="purchase-art"></div>'+
'<h3>'+e[0]+'</h3>'+
'<p>'+e[1]+'</p>'+
'<span class="tag">'+g.platforms.join(" · ")+'</span>'+
'<button class="btn" style="margin-top:20px" onclick="toast(\'Store link is not connected yet\')">Choose platform ↗</button>'+
'</div>'
}).join("");

return '<div class="rtop">'+
'<a class="brand" href="#games"><span class="mark">IG</span><span class="brandname">ICONIC<span>GAMES</span></span></a>'+
'<nav><a onclick="go(\'s0\')">Overview</a><a onclick="go(\'buy\')">Editions</a></nav>'+
'<a class="btn primary small" onclick="go(\'buy\')">Get the game ↗</a>'+
'</div>'+
'<div class="subhero" style="min-height:75vh"><div class="inner">'+
'<span class="eyebrow">NOW AVAILABLE · '+g.platforms.join(" / ")+'</span>'+
'<h1 class="display">'+g.title+'<span class="accent">.</span></h1>'+
'<p>'+g.blurb+'</p>'+
'<div style="margin-top:28px"><a class="btn primary" onclick="go(\'buy\')">Explore editions ↗</a></div>'+
'</div></div>'+
'<div class="wrap"><section>'+
sec+
'<div class="section-head" id="buy"><div>'+
'<span class="eyebrow">MAKE IT YOURS</span>'+
'<h2 class="display">Choose your <span class="accent">edition.</span></h2>'+
'</div></div>'+
'<div class="purchase-grid">'+ed+'</div>'+
'</section></div>'+foot()
}

/* NAVIGATION */

function go(id){
var e=document.getElementById(id);
if(e)e.scrollIntoView({behavior:"smooth"})
}

function route(){

var h=location.hash.slice(1)||"games";
var m=h.match(/^(.+)-(music|gallery|media)$/);
var g=m?find(m[1]):find(h);
var v;

if(m&&g){
v=vSub(g,m[2])
}else if(g){
v=g.status==="preorder"?vPre(g):vRel(g)
}else{
v=h==="news"?vNews():h==="about"?vAbout():vGames()
}

app.innerHTML=v;
window.scrollTo(0,0)
}

window.addEventListener("hashchange",function(){
playing=-1;
mtab="Featured";
route()
});

route();
</script>
</body>
</html>
